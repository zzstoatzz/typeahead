# The slot image. Both slots deploy from this file; pass the app with -a.
# Deploy from the repository root: fly deploy . --config deploy/slot/fly.toml

app = 'typeahead-shadow-a'
primary_region = 'ewr'
kill_signal = 'SIGTERM'
kill_timeout = 60

[build]
  dockerfile = 'Dockerfile'

[env]
  STORE_PORT = '8082'
  INDEX_RETRIEVAL = 'global-merge'
  INDEX_MAX_SYNC_LAG_S = '120'
  INDEX_ADOPT_CURSOR = '1'
  INDEX_PUSH_INTERVAL_MS = '5000'
  INDEX_MERGE_MIN_SEGMENTS = '3'
  INDEX_MERGE_LEVEL_LOG_SIZE = '3'
  INDEX_MERGE_MIN_LAYER_SIZE = '1000'
  INDEX_MERGE_DELETE_RATIO = '0.2'
  INDEX_MERGE_MAX_DOCS = '1000000000'
  INDEX_MERGE_NICE = '19'
  INDEX_WARM_SEGMENT_FILES = 'term,fast,fieldnorm,idx'
  CONTROL_URL = 'https://typeahead.waow.tech'

[[mounts]]
  source = 'shadow_data'
  destination = '/data'
  initial_size = '40gb'

[[restart]]
  policy = 'always'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[checks.index_ready]
  type = 'http'
  port = 8080
  method = 'GET'
  path = '/ready'
  interval = '15s'
  timeout = '2s'
  grace_period = '60s'

[checks.store_health]
  type = 'http'
  port = 8082
  method = 'GET'
  path = '/health'
  interval = '15s'
  timeout = '2s'
  grace_period = '60s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 4
  memory = '2gb'

# fly.toml app configuration file generated for typeahead-ingester on 2026-03-16T22:03:25-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'typeahead-ingester'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'typeahead_data'
  destination = '/data'

[env]
  TYPEAHEAD_URL = 'https://typeahead.nate-8fe.workers.dev'
  SQLITE_TMPDIR = '/data/tmp'

[processes]
  app = './typeahead-ingester'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

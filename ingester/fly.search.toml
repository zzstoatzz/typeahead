# fly.toml app configuration for typeahead-search.
#
# This is the read replica + HTTP search service: a clone of the ingester
# binary configured to ONLY sync from Turso → local SQLite and serve /search.
# It does NOT consume jetstream and does NOT run Turso schema migrations.
#
# Worker's SEARCH_BACKEND_URL points here after the cutover.

app = 'typeahead-search'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'typeahead_search_data'
  destination = '/data'

[env]
  # Role: sync-only + HTTP search. No jetstream → no need for TYPEAHEAD_URL/SECRET.
  ENABLE_JETSTREAM = '0'
  ENABLE_SCHEMA_MIGRATIONS = '0'
  ENABLE_SYNC = '1'

  # Prefix-index promote watcher: poll R2 latest.json, validate, ATTACH as
  # `idx`. Does NOT change the live /search path (that's a separate flag) —
  # only keeps a validated snapshot attached + queryable via /index/status.
  ENABLE_INDEX_PROMOTE = '1'
  INDEX_BUILD_ROOT = '/data'

  # The prefix-index serving path doesn't use FTS — only the snapshot + the
  # actors table (moderation belt). Maintaining actors_fts per-row was the
  # incremental bottleneck (orphan rows → failing delete-old → couldn't keep
  # up). Off here; App A keeps FTS (default on).
  ENABLE_LOCAL_FTS = '0'

  # Serve /search from the precomputed prefix index (canary). App B is not the
  # worker's backend yet, so this only affects direct callers until we point
  # SEARCH_BACKEND_URL here. Index-path errors fall back to the bsky backstop.
  USE_PREFIX_INDEX = '1'

  # Bootstrap politeness: pace Turso reads so the initial sync doesn't
  # starve worker fallback queries on the same Turso DB. ~200ms between
  # 2k-row batches drops effective rate from ~2000/s to ~1500/s — bootstrap
  # finishes in ~70min instead of ~50min, but live traffic stays responsive.
  SYNC_BOOTSTRAP_PAUSE_MS = '200'

  SQLITE_TMPDIR = '/data/tmp'

[processes]
  app = './typeahead-ingester'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  # Same manual-restart posture as the ingester app during initial bake.
  # Revisit and flip to auto-start once the service has proven stable —
  # a search service should normally restart automatically after host failure.
  # Live-backend posture: keep one machine running and auto-recover on host
  # failure (Turso fallback covers any gap). Was manual-restart during the bake.
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  # 2GB so the OS page cache can hold the hot pages of the 8.58GB prefix index
  # — at 256MB, varied-prefix queries cold-thrash to ~1s. (Index serving needs
  # RAM proportional to the working set; revisit at 10x corpus.)
  memory = '2048mb'
  cpu_kind = 'shared'
  # 4 CPUs: the 5.9M-row resync + cold prefix-index queries are CPU-bound on
  # 1 shared CPU (resync ~3-4h, cold queries ~300-500ms). Production-grade for
  # a live search backend.
  cpus = 4

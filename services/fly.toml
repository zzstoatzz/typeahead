# fly.toml app configuration file generated for typeahead-ingester on 2026-03-16T22:03:25-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'typeahead-ingester'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  MODE = 'ingester'
  TYPEAHEAD_URL = 'https://typeahead.waow.tech'

[processes]
  app = './typeahead-ingester'

[[restart]]
  policy = 'always'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

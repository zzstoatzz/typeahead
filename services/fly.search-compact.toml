# Legacy rollback configuration; no longer the normal serving app (October 25, 2026).
# Managed slot configuration and scheduling belong to my-prefect-server.
# Follow docs/evals/pds-parser-cutover-20261020.md for the guarded transition.
# October 24: previous rollback machines/volumes retired; restore from R2.
# See docs/operations.md for saved recreation configurations.
app = 'typeahead-search-compact'
primary_region = 'ewr'

[build]
  image = 'registry.fly.io/typeahead-search-compact@sha256:433155b25711c8e98b3885a56528dca26d0cb36c38d22f0a3ece6487888cc3bd'

[mounts]
  source = 'pds_replay_data'
  destination = '/data'

[env]
  MODE = 'search'
  PORT = '8080'
  INDEX_BUILD_ROOT = '/data/pds-current-20261020'
  INDEX_LATEST_KEY = 'latest.json'
  INDEX_POLL_SECS = '300'
  LOCAL_DB_PATH = '/data/pds-overlay/overlay.db'
  SQLITE_TMPDIR = '/data/pds-overlay/tmp'
  READ_POOL_SIZE = '8'

[processes]
  app = '/app/typeahead-ingester'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 4

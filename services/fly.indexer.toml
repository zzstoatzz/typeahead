# typeahead-indexer — offline snapshot builder (runs MODE=indexer, exits).
# Currently used for measurement-only full-corpus builds via `fly machine
# run` (restart=no). NOT a long-running service; do not `fly deploy` this as
# a service with MODE=indexer in env or it will loop-rebuild on restart.
app = 'typeahead-indexer'
primary_region = 'iad'  # AWS us-east-1 colocation → fast Turso export

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'typeahead_indexer_data'
  destination = '/data'

[env]
  INDEX_BUILD_ROOT = '/data'
  # Publish channel. Default `local` = build to the volume, upload NOTHING —
  # so a machine launched without an explicit channel can never touch prod.
  # Per-run overrides pick the real target (INDEX_R2_* creds come from `fly secrets`):
  #   staging: --env INDEX_CHANNEL=staging --env INDEX_STAGING_NAME=<branch>
  #   prod:    --env INDEX_CHANNEL=prod    --env INDEX_ALLOW_PROD=1
  INDEX_CHANNEL = 'local'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4

# fly.toml app configuration for typeahead-search.
#
# The HTTP search service: the same binary as the ingester, in MODE=search.
# It attaches the prefix-index snapshot promoted from R2, projects Turso
# changes newer than that snapshot into a local overlay, and serves /search
# from the two. No local copy of the corpus. It does NOT consume the firehose
# and does NOT run Turso schema migrations.
#
# Retained legacy rollback backend. Production is described in
# fly.search-compact.toml; follow the cutover runbook before any deployment.

app = 'typeahead-search'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'typeahead_search_data'
  destination = '/data'

[env]
  # Role: snapshot promote + Turso → overlay projection + HTTP search.
  # No firehose → no need for TYPEAHEAD_URL/SECRET.
  MODE = 'search'

  # Where the promote watcher keeps the A/B snapshot slots + latest.json.
  INDEX_BUILD_ROOT = '/data'

  SQLITE_TMPDIR = '/data/tmp'

[processes]
  app = './typeahead-ingester'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  # Same manual-restart posture as the ingester app during initial bake.
  # Revisit and flip to auto-start once the service has proven stable —
  # a search service should normally restart automatically after host failure.
  # Live-backend posture: keep one machine running and auto-recover on host
  # failure (Turso fallback covers any gap). Was manual-restart during the bake.
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  # 2GB so the OS page cache can hold the hot pages of the 8.58GB prefix index
  # — at 256MB, varied-prefix queries cold-thrash to ~1s. (Index serving needs
  # RAM proportional to the working set; revisit at 10x corpus.)
  memory = '2048mb'
  cpu_kind = 'shared'
  # 4 CPUs sized for the retired replica resync; docs/replica-removal-plan.md
  # phase 4 revisits this after two weeks of post-cut metrics.
  cpus = 4

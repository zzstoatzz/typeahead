# Runs only when the Workers, their tests or their configuration change.
when:
  - event: ["push"]
    branch: main
    paths:
      - "src/**"
      - "scripts/**/*.ts"
      - "scripts/ci-workerd.sh"
      - "migrations/**"
      - "lexicons/**"
      - "tools/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "cloudflare.config.ts"
      - "wrangler.config.ts"
      - ".oxlintrc.json"
      - ".tangled/workflows/deploy.yml"

engine: microvm
image: nixos

# Bun comes from a pinned nixpkgs revision, not the image. The image's 1.3.13
# fails this suite intermittently on Linux when tests start workerd (`EBADF:
# bad file descriptor, epoll_ctl` from child_process.spawn), and a failed spawn
# can leave `bun test` hanging. 1.3.14 does the same; 1.4.0 and 1.4.4 do not.
dependencies:
  - "github:nixos/nixpkgs/d4f25a3e562008648d45bcf2d70bcc7422cad84e#bun"
  - nodejs_22
  - gcc
  - patchelf
  - coreutils

# Deploy is intentionally NOT done from tangled CI — the secrets path has been
# unreliable (rolled values don't propagate, see commits 0ff3acb/eacaf7f). The
# Workers are deployed manually with `just release`. CI builds and tests.

steps:
  - name: verify
    command: |
      set -euo pipefail
      bun --version
      node --version
      bun install --frozen-lockfile
      find node_modules -path '*/workerd-linux-64/bin/workerd' -exec scripts/ci-workerd.sh {} +
      bunx tsc --noEmit
      bunx oxlint --deny-warnings src
      # a hung test run fails here, not at the spindle's 4-hour limit
      timeout 900 bun test
      node_modules/.bin/cf deploy --dry-run --no-provision
      node_modules/.bin/cf deploy --dry-run --no-provision --mode transport
      node_modules/.bin/cf deploy --dry-run --no-provision --mode renderer
      node_modules/.bin/cf deploy --dry-run --no-provision --mode collector

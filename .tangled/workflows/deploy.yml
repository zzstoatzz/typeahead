when:
  - event: ["push"]
    branch: main

engine: nixery

dependencies:
  nixpkgs:
    - bun
    - nodejs

environment:
  CLOUDFLARE_ACCOUNT_ID: "3e9ba01cd687b3c4d29033908177072e"

steps:
  - name: deploy worker
    command: |
      set -euo pipefail
      : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret not set}"
      bun install
      bunx wrangler deploy

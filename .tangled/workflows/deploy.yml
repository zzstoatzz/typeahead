when:
  - event: ["push"]
    branch: main

engine: nixery

dependencies:
  nixpkgs:
    - bun
    - nodejs

# Deploy is intentionally NOT done from tangled CI — the secrets path has been
# unreliable (rolled values don't propagate, see commits 0ff3acb/eacaf7f). The
# worker is deployed manually with `bunx wrangler deploy` using CF_NEW from
# .env. CI just verifies the bundle builds and tests pass. Revisit when the
# tangled secret store is fixed.

steps:
  - name: verify
    command: |
      set -euo pipefail
      bun install
      bunx tsc --noEmit
      bunx oxlint --deny-warnings src
      bun test
      bunx wrangler deploy --dry-run

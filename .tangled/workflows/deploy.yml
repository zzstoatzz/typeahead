when:
  - event: ["push"]
    branch: main

engine: microvm
image: nixos

# Bun comes from a pinned nixpkgs revision, not the image. The image's 1.3.13
# fails this suite intermittently on Linux when tests start workerd (`EBADF:
# bad file descriptor, epoll_ctl` from child_process.spawn), and a failed spawn
# can leave `bun test` hanging. 1.3.14 does the same; 1.4.0 and 1.4.4 do not.
dependencies:
  - "github:nixos/nixpkgs/d4f25a3e562008648d45bcf2d70bcc7422cad84e#bun"
  - nodejs
  - gcc
  - patchelf
  - coreutils

# Deploy is intentionally NOT done from tangled CI — the secrets path has been
# unreliable (rolled values don't propagate, see commits 0ff3acb/eacaf7f). The
# worker is deployed manually with `bunx wrangler deploy` using CF_NEW from
# .env. CI just verifies the bundle builds and tests pass. Revisit when the
# tangled secret store is fixed.

steps:
  - name: verify
    command: |
      set -euo pipefail
      bun --version
      bun install
      scripts/ci-workerd.sh
      bunx tsc --noEmit
      bunx oxlint --deny-warnings src
      # a hung test run fails here, not at the spindle's 4-hour limit
      timeout 900 bun test
      bunx wrangler deploy --dry-run
      bunx wrangler deploy -c deploy/search-transport/wrangler.jsonc --dry-run
      bunx wrangler deploy -c deploy/image-renderer/wrangler.jsonc --dry-run

when:
  - event: ["push"]
    branch: main
engine: microvm
image: nixos
dependencies:
  - bash
  - just
  - python3
  - coreutils
  - curl
  - gnutar
  - xz
  - rustc
  - cargo
  - gcc
steps:
  - name: tantivy-local-verification
    command: |
      set -eu
      scripts/ci-zig.sh "$PWD/.zig"
      export PATH="$PWD/.zig:$PATH"
      test "$(zig version)" = "0.17.0"
      just --no-dotenv test-tantivy

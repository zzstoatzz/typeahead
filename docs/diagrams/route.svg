<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 730" role="img" aria-labelledby="route-title route-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="route-title">Two slots and the route</title>
  <desc id="route-desc">The public Worker sends searches to the search transport, which follows a route record naming the current and previous slot. Slot A serves and slot B stands by; each runs a store process and a search engine and follows the relay, the PLC directory, the labeler, Bluesky and Worker policy on its own. A flip is one write to the route record, allowed only when the standby matches the serving slot.</desc>
  <style>
    svg { --fg: #1f2328; --muted: #59636e; --line: #8c959f; --panel: #f6f8fa; --accent: #0969da; --accent-soft: #ddf4ff; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6edf3; --muted: #9198a1; --line: #6e7681; --panel: #161b22; --accent: #4493f8; --accent-soft: #121d2f; --bg: #0d1117; }
    }
    .ground { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .slot { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { fill: var(--fg); font-size: 17px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 14px; }
    .body { fill: var(--fg); font-size: 15px; }
    .note { fill: var(--muted); font-size: 14px; }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; }
    .later { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .flow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
    .head { fill: var(--line); }
    .flowhead { fill: var(--accent); }
    .label { fill: var(--fg); font-size: 14px; }
    .icon { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon.on { stroke: var(--accent); }
  </style>

  <rect class="ground" width="600" height="730" rx="12"/>
  <rect class="box" x="150" y="20" width="300" height="60" rx="10"/>
  <g class="icon" transform="translate(164 36.0) scale(1.167)"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.6 1.2 3.9 3.9 0 0 1-.5 7.76z"/></g>
  <text class="name" x="204" y="47.0">Public Worker</text>
  <text class="sub" x="204" y="67.0">search requests</text>
  <path class="wire" d="M200 80 V102"/>
  <polygon class="head" points="200,112 193,100 207,100"/>
  <rect class="core" x="50" y="114" width="300" height="66" rx="10"/>
  <g class="icon on" transform="translate(64 133.0) scale(1.167)"><path d="M3 12h6l5-6h6M9 12l5 6h6"/><path d="M17.5 3.5 20 6l-2.5 2.5M17.5 15.5 20 18l-2.5 2.5"/></g>
  <text class="name" x="104" y="144.0">Search transport</text>
  <text class="sub" x="104" y="164.0">follows the route record</text>
  <path class="wire" d="M350 147 H380"/>
  <polygon class="head" points="390,147 378,140 378,154"/>
  <rect class="box" x="392" y="102" width="188" height="90" rx="10"/>
  <g class="icon" transform="translate(406 112) scale(1.167)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></g>
  <text class="name" x="446" y="131">Route record</text>
  <text class="sub" x="408" y="158">current: slot A</text>
  <text class="sub" x="408" y="178">previous: slot B</text>
  <path class="flow" d="M230 180 V288"/>
  <polygon class="flowhead" points="230,298 223,286 237,286"/>
  <text class="label" x="216" y="226" text-anchor="end">searches</text>
  <path class="later" d="M300 180 V218 H520 V288"/>
  <polygon class="head" points="520,298 513,286 527,286"/>
  <text class="label" x="366" y="240">after a flip</text>
  <rect class="slot" x="20" y="250" width="270" height="264" rx="12"/>
  <g class="icon" transform="translate(40 264) scale(0.917)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01M11 7.500h6M11 16.500h6"/></g>
  <text class="name" x="72" y="281">Slot A, serving</text>
  <rect class="core" x="40" y="300" width="230" height="60" rx="10"/>
  <g class="icon on" transform="translate(54 316.0) scale(1.167)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20.5 20.5-5.2-5.2"/></g>
  <text class="name" x="94" y="327.0">Search engine</text>
  <text class="sub" x="94" y="347.0">answers searches</text>
  <path class="flow" d="M155 400 V372"/>
  <polygon class="flowhead" points="155,362 148,374 162,374"/>
  <rect class="core" x="40" y="400" width="230" height="60" rx="10"/>
  <g class="icon on" transform="translate(54 416.0) scale(1.167)"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12c0 1.66 3.13 3 7 3s7-1.34 7-3"/></g>
  <text class="name" x="94" y="427.0">Store process</text>
  <text class="sub" x="94" y="447.0">keeps the accounts</text>
  <path class="wire" d="M155 554 V472"/>
  <polygon class="head" points="155,462 148,474 162,474"/>
  <rect class="slot" x="310" y="250" width="270" height="264" rx="12"/>
  <g class="icon" transform="translate(330 264) scale(0.917)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01M11 7.500h6M11 16.500h6"/></g>
  <text class="name" x="362" y="281">Slot B, standby</text>
  <rect class="core" x="330" y="300" width="230" height="60" rx="10"/>
  <g class="icon on" transform="translate(344 316.0) scale(1.167)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20.5 20.5-5.2-5.2"/></g>
  <text class="name" x="384" y="327.0">Search engine</text>
  <text class="sub" x="384" y="347.0">answers searches</text>
  <path class="flow" d="M445 400 V372"/>
  <polygon class="flowhead" points="445,362 438,374 452,374"/>
  <rect class="core" x="330" y="400" width="230" height="60" rx="10"/>
  <g class="icon on" transform="translate(344 416.0) scale(1.167)"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12c0 1.66 3.13 3 7 3s7-1.34 7-3"/></g>
  <text class="name" x="384" y="427.0">Store process</text>
  <text class="sub" x="384" y="447.0">keeps the accounts</text>
  <path class="wire" d="M445 554 V472"/>
  <polygon class="head" points="445,462 438,474 452,474"/>
  <rect class="box" x="20" y="554" width="560" height="70" rx="10"/>
  <g class="icon" transform="translate(40 566) scale(0.833)"><circle cx="12" cy="12" r="1.8"/><path d="M8.1 8.1a5.5 5.5 0 0 0 0 7.8M15.9 8.1a5.5 5.5 0 0 1 0 7.8M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></g>
  <g class="icon" transform="translate(70 566) scale(0.833)"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10.5" r="2"/><path d="M5.5 16c.5-1.5 1.6-2.2 3-2.2s2.5.7 3 2.2M14.5 10h4M14.5 14h4"/></g>
  <g class="icon" transform="translate(100 566) scale(0.833)"><path d="M3.5 11.5v-8h8l9 9-8 8z"/><circle cx="7.8" cy="7.8" r="1.3"/></g>
  <g class="icon" transform="translate(130 566) scale(0.833)"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.8 3.6-5.7 7.5-5.7s6.700 1.900 7.500 5.700"/></g>
  <g class="icon" transform="translate(160 566) scale(0.833)"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></g>
  <text class="name" x="200" y="582">The sources</text>
  <text class="sub" x="40" y="608">each slot follows them on its own; the slots never talk to each other</text>
  <text class="note" x="20" y="660">A flip is one write to the route record. It is allowed only when the</text>
  <text class="note" x="20" y="682">standby reports the same build and policy as the serving slot,</text>
  <text class="note" x="20" y="704">data less than 2 minutes behind, and an account count within 2%.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 748" role="img" aria-labelledby="outside-title outside-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="outside-title">What runs where</title>
  <desc id="outside-desc">Cloudflare holds the public Worker, the search transport, the route record in R2, the control database in D1, statistics in D1 and KV, and the image renderer. Fly holds the two slots, each a store process and a search engine. The relay, the PLC directory, the labeler and the Bluesky AppView are run by others and only read.</desc>
  <style>
    svg { --fg: #1f2328; --muted: #59636e; --line: #8c959f; --panel: #f6f8fa; --accent: #0969da; --accent-soft: #ddf4ff; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6edf3; --muted: #9198a1; --line: #6e7681; --panel: #161b22; --accent: #4493f8; --accent-soft: #121d2f; --bg: #0d1117; }
    }
    .ground { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .slot { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { fill: var(--fg); font-size: 17px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 14px; }
    .body { fill: var(--fg); font-size: 15px; }
    .note { fill: var(--muted); font-size: 14px; }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; }
    .later { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .flow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
    .head { fill: var(--line); }
    .flowhead { fill: var(--accent); }
    .label { fill: var(--fg); font-size: 14px; }
    .icon { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon.on { stroke: var(--accent); }
  </style>

  <rect class="ground" width="600" height="748" rx="12"/>
  <rect class="slot" x="20" y="20" width="560" height="318" rx="12"/>
  <text class="name" x="40" y="52">Cloudflare</text>
  <text class="note" x="140" y="52">everything except the accounts</text>
  <rect class="box" x="40" y="72" width="250" height="68" rx="10"/>
  <g class="icon" transform="translate(54 92.0) scale(1.167)"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.6 1.2 3.9 3.9 0 0 1-.5 7.76z"/></g>
  <text class="name" x="94" y="103.0">Public Worker</text>
  <text class="sub" x="94" y="123.0">API, pages, limits, cache</text>
  <rect class="box" x="310" y="72" width="250" height="68" rx="10"/>
  <g class="icon" transform="translate(324 92.0) scale(1.167)"><path d="M3 12h6l5-6h6M9 12l5 6h6"/><path d="M17.5 3.5 20 6l-2.5 2.5M17.5 15.5 20 18l-2.5 2.5"/></g>
  <text class="name" x="364" y="103.0">Search transport</text>
  <text class="sub" x="364" y="123.0">finds the serving slot</text>
  <rect class="box" x="40" y="156" width="250" height="68" rx="10"/>
  <g class="icon" transform="translate(54 176.0) scale(1.167)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></g>
  <text class="name" x="94" y="187.0">Route record</text>
  <text class="sub" x="94" y="207.0">R2: which slot serves</text>
  <rect class="box" x="310" y="156" width="250" height="68" rx="10"/>
  <g class="icon" transform="translate(324 176.0) scale(1.167)"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></g>
  <text class="name" x="364" y="187.0">Control database</text>
  <text class="sub" x="364" y="207.0">D1: policy, index requests</text>
  <rect class="box" x="40" y="240" width="250" height="68" rx="10"/>
  <g class="icon" transform="translate(54 260.0) scale(1.167)"><path d="M3.500 20.500h17M7 17v-6M12 17V5M17 17v-9"/></g>
  <text class="name" x="94" y="271.0">Statistics</text>
  <text class="sub" x="94" y="291.0">D1 and KV: usage counts</text>
  <rect class="box" x="310" y="240" width="250" height="68" rx="10"/>
  <g class="icon" transform="translate(324 260.0) scale(1.167)"><rect x="3" y="4.500" width="18" height="15" rx="2.500"/><circle cx="8.500" cy="9.500" r="1.600"/><path d="m20.500 15.500-4.500-4.500-8.500 8.500"/></g>
  <text class="name" x="364" y="271.0">Image renderer</text>
  <text class="sub" x="364" y="291.0">share images and icons</text>
  <rect class="slot" x="20" y="358" width="560" height="134" rx="12"/>
  <text class="name" x="40" y="390">Fly</text>
  <text class="note" x="76" y="390">the accounts and the search index, twice</text>
  <rect class="core" x="40" y="408" width="250" height="68" rx="10"/>
  <g class="icon on" transform="translate(54 428.0) scale(1.167)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01M11 7.500h6M11 16.500h6"/></g>
  <text class="name" x="94" y="439.0">Slot A</text>
  <text class="sub" x="94" y="459.0">store + search engine</text>
  <rect class="core" x="310" y="408" width="250" height="68" rx="10"/>
  <g class="icon on" transform="translate(324 428.0) scale(1.167)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01M11 7.500h6M11 16.500h6"/></g>
  <text class="name" x="364" y="439.0">Slot B</text>
  <text class="sub" x="364" y="459.0">store + search engine</text>
  <rect class="slot" x="20" y="512" width="560" height="216" rx="12"/>
  <text class="name" x="40" y="544">Run by others</text>
  <text class="note" x="178" y="544">read by the slots, never written</text>
  <rect class="box" x="40" y="564" width="250" height="60" rx="10"/>
  <g class="icon" transform="translate(54 580.0) scale(1.167)"><circle cx="12" cy="12" r="1.8"/><path d="M8.1 8.1a5.5 5.5 0 0 0 0 7.8M15.9 8.1a5.5 5.5 0 0 1 0 7.8M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></g>
  <text class="name" x="94" y="591.0">Relay</text>
  <text class="sub" x="94" y="611.0">account events</text>
  <rect class="box" x="310" y="564" width="250" height="60" rx="10"/>
  <g class="icon" transform="translate(324 580.0) scale(1.167)"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10.5" r="2"/><path d="M5.5 16c.5-1.5 1.6-2.2 3-2.2s2.5.7 3 2.2M14.5 10h4M14.5 14h4"/></g>
  <text class="name" x="364" y="591.0">PLC directory</text>
  <text class="sub" x="364" y="611.0">identity changes</text>
  <rect class="box" x="40" y="640" width="250" height="60" rx="10"/>
  <g class="icon" transform="translate(54 656.0) scale(1.167)"><path d="M3.5 11.5v-8h8l9 9-8 8z"/><circle cx="7.8" cy="7.8" r="1.3"/></g>
  <text class="name" x="94" y="667.0">Labeler</text>
  <text class="sub" x="94" y="687.0">moderation labels</text>
  <rect class="box" x="310" y="640" width="250" height="60" rx="10"/>
  <g class="icon" transform="translate(324 656.0) scale(1.167)"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.8 3.6-5.7 7.5-5.7s6.700 1.900 7.500 5.700"/></g>
  <text class="name" x="364" y="667.0">Bluesky AppView</text>
  <text class="sub" x="364" y="687.0">profiles and counts</text>
</svg>

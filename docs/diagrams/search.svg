<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 762" role="img" aria-labelledby="search-title search-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="search-title">A search request</title>
  <desc id="search-desc">An app sends a search to the public Worker, which checks parameters and rate limits and answers from its cache when it can. On a cache miss the search transport reads the route record to learn which slot is serving and sends the query to that slot's search engine, which matches handles and names by prefix, ranks them and returns profiles.</desc>
  <style>
    svg { --fg: #1f2328; --muted: #59636e; --line: #8c959f; --panel: #f6f8fa; --accent: #0969da; --accent-soft: #ddf4ff; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6edf3; --muted: #9198a1; --line: #6e7681; --panel: #161b22; --accent: #4493f8; --accent-soft: #121d2f; --bg: #0d1117; }
    }
    .ground { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .slot { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { fill: var(--fg); font-size: 17px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 14px; }
    .body { fill: var(--fg); font-size: 15px; }
    .note { fill: var(--muted); font-size: 14px; }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; }
    .later { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .flow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
    .head { fill: var(--line); }
    .flowhead { fill: var(--accent); }
    .label { fill: var(--fg); font-size: 14px; }
    .icon { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon.on { stroke: var(--accent); }
  </style>

  <rect class="ground" width="600" height="762" rx="12"/>
  <rect class="box" x="150" y="20" width="300" height="60" rx="10"/>
  <g class="icon" transform="translate(164 36.0) scale(1.167)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></g>
  <text class="name" x="204" y="47.0">An app</text>
  <text class="sub" x="204" y="67.0">someone types in a search field</text>
  <path class="wire" d="M300 80 V120"/>
  <polygon class="head" points="300,130 293,118 307,118"/>
  <text class="label" x="314" y="110">search for "nat"</text>
  <rect class="core" x="50" y="132" width="500" height="130" rx="10"/>
  <g class="icon on" transform="translate(70 146) scale(1.167)"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.6 1.2 3.9 3.9 0 0 1-.5 7.76z"/></g>
  <text class="name" x="110" y="166">Public Worker</text>
  <text class="body" x="74" y="200">Checks the parameters and the rate limit.</text>
  <text class="body" x="74" y="226">Answers from its cache if it saw the same query</text>
  <text class="body" x="74" y="252">in the last 60 seconds.</text>
  <path class="wire" d="M300 262 V312"/>
  <polygon class="head" points="300,322 293,310 307,310"/>
  <text class="label" x="314" y="297">on a cache miss</text>
  <rect class="core" x="50" y="324" width="320" height="130" rx="10"/>
  <g class="icon on" transform="translate(70 338) scale(1.167)"><path d="M3 12h6l5-6h6M9 12l5 6h6"/><path d="M17.5 3.5 20 6l-2.5 2.5M17.5 15.5 20 18l-2.5 2.5"/></g>
  <text class="name" x="110" y="358">Search transport</text>
  <text class="body" x="74" y="392">Reads the route record to learn</text>
  <text class="body" x="74" y="418">which slot is serving.</text>
  <text class="note" x="74" y="442">its copy is at most 1 second old</text>
  <path class="wire" d="M370 389 H380"/>
  <polygon class="head" points="390,389 378,382 378,396"/>
  <rect class="box" x="392" y="359" width="188" height="60" rx="10"/>
  <g class="icon" transform="translate(406 375.0) scale(1.167)"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h4"/></g>
  <text class="name" x="446" y="386.0">Route record</text>
  <text class="sub" x="446" y="406.0">which slot serves</text>
  <path class="flow" d="M210 454 V530"/>
  <polygon class="flowhead" points="210,540 203,528 217,528"/>
  <text class="label" x="226" y="490">the query</text>
  <rect class="slot" x="20" y="512" width="560" height="196" rx="12"/>
  <rect class="core" x="50" y="542" width="500" height="122" rx="10"/>
  <g class="icon on" transform="translate(70 556) scale(1.167)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20.5 20.5-5.2-5.2"/></g>
  <text class="name" x="110" y="576">Search engine</text>
  <text class="body" x="74" y="610">Finds handles and names that start with the query.</text>
  <text class="body" x="74" y="636">Ranks them, an exact handle first, and returns profiles.</text>
  <g class="icon" transform="translate(50 674) scale(0.917)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01M11 7.500h6M11 16.500h6"/></g>
  <text class="name" x="82" y="691">The serving slot</text>
  <text class="note" x="20" y="740">The answer returns the same way, and the Worker caches it for 60 seconds.</text>
</svg>

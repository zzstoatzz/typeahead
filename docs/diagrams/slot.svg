<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="slot-title slot-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="slot-title">Inside one slot</title>
  <desc id="slot-desc">A slot is one machine running a store process and a search engine. The store follows the relay, the PLC directory and the labeler, asks Bluesky for profiles and the Worker for policy, and keeps one record per account on disk. An index bridge sends each changed account to the search engine, which holds one document per account and answers search, profile and count requests from the Worker.</desc>
  <style>
    svg { --fg: #1f2328; --muted: #59636e; --line: #8c959f; --panel: #f6f8fa; --accent: #0969da; --accent-soft: #ddf4ff; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6edf3; --muted: #9198a1; --line: #6e7681; --panel: #161b22; --accent: #4493f8; --accent-soft: #121d2f; --bg: #0d1117; }
    }
    .ground { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .slot { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { fill: var(--fg); font-size: 17px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 14px; }
    .body { fill: var(--fg); font-size: 15px; }
    .note { fill: var(--muted); font-size: 14px; }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; }
    .later { stroke: var(--line); stroke-width: 2; fill: none; stroke-dasharray: 5 5; }
    .flow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
    .head { fill: var(--line); }
    .flowhead { fill: var(--accent); }
    .label { fill: var(--fg); font-size: 14px; }
    .icon { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon.on { stroke: var(--accent); }
  </style>

  <rect class="ground" width="600" height="900" rx="12"/>
  <rect class="box" x="20" y="20" width="164" height="60" rx="10"/>
  <g class="icon" transform="translate(34 36.0) scale(1.167)"><circle cx="12" cy="12" r="1.8"/><path d="M8.1 8.1a5.5 5.5 0 0 0 0 7.8M15.9 8.1a5.5 5.5 0 0 1 0 7.8M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></g>
  <text class="name" x="74" y="47.0">Relay</text>
  <text class="sub" x="74" y="67.0">account events</text>
  <rect class="box" x="196" y="20" width="208" height="60" rx="10"/>
  <g class="icon" transform="translate(210 36.0) scale(1.167)"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10.5" r="2"/><path d="M5.5 16c.5-1.5 1.6-2.2 3-2.2s2.5.7 3 2.2M14.5 10h4M14.5 14h4"/></g>
  <text class="name" x="250" y="47.0">PLC directory</text>
  <text class="sub" x="250" y="67.0">identity changes</text>
  <rect class="box" x="416" y="20" width="164" height="60" rx="10"/>
  <g class="icon" transform="translate(430 36.0) scale(1.167)"><path d="M3.5 11.5v-8h8l9 9-8 8z"/><circle cx="7.8" cy="7.8" r="1.3"/></g>
  <text class="name" x="470" y="47.0">Labeler</text>
  <text class="sub" x="470" y="67.0">labels</text>
  <rect class="box" x="20" y="94" width="272" height="60" rx="10"/>
  <g class="icon" transform="translate(34 110.0) scale(1.167)"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.8 3.6-5.7 7.5-5.7s6.700 1.900 7.500 5.700"/></g>
  <text class="name" x="74" y="121.0">Bluesky AppView</text>
  <text class="sub" x="74" y="141.0">profiles and counts</text>
  <rect class="box" x="308" y="94" width="272" height="60" rx="10"/>
  <g class="icon" transform="translate(322 110.0) scale(1.167)"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.6 1.2 3.9 3.9 0 0 1-.5 7.76z"/></g>
  <text class="name" x="362" y="121.0">Worker</text>
  <text class="sub" x="362" y="141.0">policy, index requests</text>
  <path class="wire" d="M300 154 V232"/>
  <polygon class="head" points="300,242 293,230 307,230"/>
  <text class="label" x="314" y="190">the store follows or asks;</text>
  <text class="label" x="314" y="208">nothing pushes into a slot</text>
  <rect class="slot" x="20" y="218" width="560" height="556" rx="12"/>
  <rect class="core" x="50" y="244" width="500" height="182" rx="10"/>
  <g class="icon on" transform="translate(70 258) scale(1.167)"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12c0 1.66 3.13 3 7 3s7-1.34 7-3"/></g>
  <text class="name" x="110" y="278">Store process</text>
  <text class="body" x="74" y="312">One record per account, every field, on disk.</text>
  <text class="body" x="74" y="338">Applies events, verifies handles, refreshes profiles.</text>
  <text class="body" x="74" y="364">Applies moderation policy.</text>
  <text class="body" x="74" y="390">Keeps a log of every change it makes.</text>
  <text class="note" x="74" y="414">its port is private: health checks only</text>
  <path class="flow" d="M300 426 V492"/>
  <polygon class="flowhead" points="300,502 293,490 307,490"/>
  <g class="icon on" transform="translate(316 440) scale(0.833)"><path d="M12 4v15M6 13l6 6 6-6"/></g>
  <text class="label" x="342" y="455">index bridge:</text>
  <text class="label" x="316" y="477">sends each changed account</text>
  <rect class="core" x="50" y="504" width="500" height="156" rx="10"/>
  <g class="icon on" transform="translate(70 518) scale(1.167)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20.5 20.5-5.2-5.2"/></g>
  <text class="name" x="110" y="538">Search engine</text>
  <text class="body" x="74" y="572">One document per account: what a result shows.</text>
  <text class="body" x="74" y="598">Prefix search and ranking (Tantivy).</text>
  <text class="body" x="74" y="624">Stops answering if the store falls 2 minutes behind.</text>
  <text class="note" x="74" y="648">its port is the only way into a slot</text>
  <g class="icon" transform="translate(50 680) scale(0.917)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.500h.01M7 16.500h.01M11 7.500h6M11 16.500h6"/></g>
  <text class="name" x="82" y="697">One slot</text>
  <text class="note" x="50" y="722">A Fly machine with its own disk. A supervisor restarts</text>
  <text class="note" x="50" y="742">either process without stopping the other.</text>
  <path class="wire" d="M500 820 V672"/>
  <polygon class="head" points="500,662 493,674 507,674"/>
  <text class="label" x="486" y="802" text-anchor="end">search, profile and count requests</text>
  <rect class="box" x="150" y="820" width="400" height="60" rx="10"/>
  <g class="icon" transform="translate(164 836.0) scale(1.167)"><path d="M7.5 18.5a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.6 1.2 3.9 3.9 0 0 1-.5 7.76z"/></g>
  <text class="name" x="204" y="847.0">Worker</text>
  <text class="sub" x="204" y="867.0">through the search transport</text>
</svg>

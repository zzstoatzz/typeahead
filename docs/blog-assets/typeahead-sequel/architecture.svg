<rect x="1065" y="280" width="276" height="93" rx="5" fill="#eaf5f2"/>
<text x="1083" y="311" class="label" style="fill:#08766c">Live overlay</text>
<text x="1083" y="342" class="small">Additions + suppressions</text>

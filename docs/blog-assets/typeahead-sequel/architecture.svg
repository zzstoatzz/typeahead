<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">Typeahead: prepare the search, then serve it</title><desc id="desc">Clients query a Cloudflare Worker which asks a Zig search service on Fly. The search service holds an R2 snapshot and a live overlay, with no full actor replica. Relay events go through a Zig ingester and the Worker into Turso. Prefect jobs on heavypad build snapshots and enrich actors. Turso changes feed the overlay. Request counters still write to Turso.</desc>
<defs>
<marker id="request" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245cba"/></marker>
<marker id="live" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#08766c"/></marker>
<marker id="batch" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7450a2"/></marker>
<marker id="quiet" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52647a"/></marker>
</defs>
<rect width="1440" height="1080" fill="#f7f9fc"/>
<style>text{font-family:Helvetica,Arial,sans-serif;fill:#152940}.small{font-size:17px;fill:#52647a}.body{font-size:20px}.name{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:600}</style>
<text x="48" y="64" class="name">typeahead, after the replica</text>
<text x="48" y="102" class="body">Prepare the expensive work offline. Answer each keystroke with a small lookup and merge.</text>
<text x="48" y="157" class="label" style="fill:#245cba">Serving</text>

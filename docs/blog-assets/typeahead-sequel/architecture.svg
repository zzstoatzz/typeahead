<path d="M830 681 V722 H600 V796" fill="none" stroke="#7450a2" stroke-width="2.5" marker-end="url(#batch)"/>
<text x="627" y="712" class="small" style="fill:#7450a2">export</text>
<path d="M720 796 V753 H985 V681" fill="none" stroke="#7450a2" stroke-width="2.5" marker-end="url(#batch)"/>
<text x="811" y="778" class="small" style="fill:#7450a2">enrich</text>
<path d="M773 874 H933" fill="none" stroke="#7450a2" stroke-width="2.5" marker-end="url(#batch)"/>

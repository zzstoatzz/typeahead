<text x="370" y="899" class="body">Zig snapshot builder on home disk</text>
<text x="370" y="925" class="body">Identity hourly · profiles daily</text>
<text x="370" y="951" class="body">PLC weekly</text>
<rect x="933" y="796" width="300" height="172" rx="9" fill="white" stroke="#7450a2" stroke-width="1.5"/>

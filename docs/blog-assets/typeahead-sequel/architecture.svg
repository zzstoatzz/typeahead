<text x="1260" y="746" class="small" style="fill:#7450a2">verify, then</text>
<text x="1260" y="773" class="small" style="fill:#7450a2">promote</text>
<text x="48" y="1020" class="label">Failure boundaries</text>
<text x="242" y="1020" class="body">Late build → keep prior snapshot. Engine down → uncached empty results.</text>
<text x="48" y="1053" class="small">Logfire observes both Fly services; Workers Logs covers the edge. Operator access to heavypad uses Tailscale.</text>
</svg>